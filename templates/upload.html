<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Subir PDF</title>
</head>
<body>
<h2>Subir un archivo PDF</h2>
<form action="/upload" method="post" enctype="multipart/form-data">
    <input type="file" name="pdf" accept=".pdf" required>
    <button type="submit">Subir PDF</button>
</form>
</body>
</html>
